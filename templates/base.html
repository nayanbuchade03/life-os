<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS // Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <i data-lucide="terminal"></i>
                <span>LIFE_OS</span>
            </div>
            
            <ul class="nav-menu">
                <li>
                    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('tasks.index') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('tasks') %}active{% endif %}">
                        <i data-lucide="check-square"></i> Tasks & routines
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('dsa.index') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('dsa') %}active{% endif %}">
                        <i data-lucide="code-2"></i> DSA Tracker
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('jobs.index') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('jobs') %}active{% endif %}">
                        <i data-lucide="briefcase"></i> Applications
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('analytics.index') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('analytics') %}active{% endif %}">
                        <i data-lucide="bar-chart-2"></i> Analytics
                    </a>
                </li>
                <li style="margin-top: auto;">
                    <a href="{{ url_for('settings.index') }}" class="nav-item {% if request.endpoint and request.endpoint.startswith('settings') %}active{% endif %}">
                        <i data-lucide="settings"></i> Settings
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            
            <header class="topbar">
                <div class="topbar-group">
                    <div class="sys-info">
                        <span><i data-lucide="activity"></i> SYS_STATUS: OPTIMAL</span>
                        <span id="current-date">--</span>
                    </div>
                </div>
                <div class="topbar-group">
                    <div class="sys-info">
                        <span>PRG_LOAD: [||||||||--] 80%</span>
                    </div>
                    <button class="btn btn-secondary" style="padding: 4px 8px;">
                        <i data-lucide="command"></i> K
                    </button>
                </div>
            </header>

            <div style="padding: 1.5rem 2rem;">
                {% block content %}{% endblock %}
            </div>
            
        </main>
    </div>

    <script>
        lucide.createIcons();

        function updateDate() {
            const dateStr = new Date().toLocaleDateString('en-GB', { 
                weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            }).toUpperCase();
            document.getElementById('current-date').textContent = `TIME: ${dateStr}`;
        }
        setInterval(updateDate, 1000);
        updateDate();
    </script>
</body>
</html>
