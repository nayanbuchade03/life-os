<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="sidebar">
        <div class="brand">Life<span>OS</span></div>
        <ul class="nav-menu">
            <li>
                <a href="{{ url_for('jobs.index') }}"
                    class="nav-item {% if request.endpoint and request.endpoint.startswith('jobs') %}active{% endif %}">
                    <i class="ph ph-briefcase"></i> Job Applications
                </a>
            </li>
            <li>
                <a href="{{ url_for('dsa.index') }}"
                    class="nav-item {% if request.endpoint and request.endpoint.startswith('dsa') %}active{% endif %}">
                    <i class="ph ph-code"></i> DSA Tracker
                </a>
            </li>
            <li>
                <a href="{{ url_for('dashboard') }}" class="nav-item active">
                    <i class="ph ph-squares-four"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <i class="ph ph-check-square"></i> Tasks & Routines
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <i class="ph ph-target"></i> Goals
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <i class="ph ph-code"></i> DSA Tracker
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <i class="ph ph-briefcase"></i> Job Applications
                </a>
            </li>
            <li>
                <a href="#" class="nav-item">
                    <i class="ph ph-chart-line-up"></i> Analytics
                </a>
            </li>
            <li style="margin-top: auto;">
                <a href="#" class="nav-item">
                    <i class="ph ph-gear"></i> Settings
                </a>
            </li>
        </ul>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
