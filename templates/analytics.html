{% extends 'base.html' %}

{% block content %}
<header class="page-header">
    <h1 class="page-title">Analytics</h1>
    <p class="page-subtitle">Visualize your productivity and progress.</p>
</header>

<div class="dashboard-grid" style="grid-template-columns: 1fr; margin-bottom: 1.5rem;">
    <div class="card" style="height: 350px;">
        <div class="card-header">
            <span class="card-title">Tasks Completed (Last 7 Days)</span>
        </div>
        <div style="position: relative; height: 100%; width: 100%;">
            <canvas id="tasksChart"></canvas>
        </div>
    </div>
</div>

<div class="dashboard-grid" style="grid-template-columns: 1fr 1fr;">
    <div class="card" style="height: 350px;">
        <div class="card-header">
            <span class="card-title">DSA Problem Breakdown</span>
        </div>
        <div style="position: relative; height: 100%; width: 100%; display: flex; justify-content: center;">
            <canvas id="dsaChart"></canvas>
        </div>
    </div>

    <div class="card" style="height: 350px;">
        <div class="card-header">
            <span class="card-title">Job Application Pipeline</span>
        </div>
        <div style="position: relative; height: 100%; width: 100%;">
            <canvas id="jobsChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const tasksLabels = JSON.parse('{{ tasks_labels | safe }}');
    const tasksData = JSON.parse('{{ tasks_data | safe }}');
    
    const dsaLabels = JSON.parse('{{ dsa_labels | safe }}');
    const dsaData = JSON.parse('{{ dsa_data | safe }}');
    
    const jobsLabels = JSON.parse('{{ jobs_labels | safe }}');
    const jobsData = JSON.parse('{{ jobs_data | safe }}');

    Chart.defaults.color = '#94a3b8'; 
    Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";
    const gridColor = '#334155'; 

    new Chart(document.getElementById('tasksChart'), {
        type: 'line',
        data: {
            labels: tasksLabels,
            datasets: [{
                label: 'Tasks Completed',
                data: tasksData,
                borderColor: '#3b82f6', 
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                tension: 0.3,
                fill: true,
                pointBackgroundColor: '#0f172a' 
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1 } },
                x: { grid: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById('dsaChart'), {
        type: 'doughnut',
        data: {
            labels: dsaLabels,
            datasets: [{
                data: dsaData,
                backgroundColor: ['#10b981', '#f59e0b', '#ef4444'], 
                borderWidth: 0,
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
                legend: { position: 'bottom', labels: { padding: 20 } }
            }
        }
    });

    new Chart(document.getElementById('jobsChart'), {
        type: 'bar',
        data: {
            labels: jobsLabels,
            datasets: [{
                label: 'Applications',
                data: jobsData,
                backgroundColor: 'rgba(168, 85, 247, 0.8)', 
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { beginAtZero: true, grid: { color: gridColor }, ticks: { stepSize: 1 } },
                x: { grid: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });
});
</script>
{% endblock %}
